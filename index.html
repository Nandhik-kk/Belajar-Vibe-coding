<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Personal</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --text-color: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --danger: #ef4444;
    }

    body.dark {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --danger: #f87171;
    }

    * {
      box-sizing: border-box;
      transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin: 0;
    }

    .clock-widget {
      margin-top: 6px;
    }

    .time-display {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .date-display {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    button.theme-toggle {
      background: transparent;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    button.theme-toggle:hover {
      background-color: var(--border-color);
    }

    .input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    input[type="text"] {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: var(--card-bg);
      color: var(--text-color);
      outline: none;
      font-size: 0.95rem;
    }

    input[type="text"]:focus {
      border-color: var(--accent);
    }

    .btn-add {
      background-color: var(--accent);
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .btn-add:hover {
      background-color: var(--accent-hover);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    li {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 8px;
    }

    li.completed span {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    li span {
      flex: 1;
      margin: 0 10px;
      word-break: break-word;
      font-size: 0.95rem;
    }

    input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    .btn-del {
      background: none;
      border: none;
      color: var(--danger);
      cursor: pointer;
      font-size: 1rem;
      padding: 4px 8px;
      border-radius: 4px;
      opacity: 0.7;
    }

    .btn-del:hover {
      opacity: 1;
      background-color: rgba(239, 68, 68, 0.1);
    }

    .empty-state {
      text-align: center;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>Halo! 👋</h1>
        <div class="clock-widget">
          <div class="time-display" id="clockTime">00:00:00</div>
          <div class="date-display" id="clockDate">Senin, 1 Januari 2026</div>
        </div>
      </div>
      <button class="theme-toggle" id="themeBtn">🌓 Ganti Tema</button>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Ketik tugas baru...">
      <button class="btn-add" id="addBtn">Tambah</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script>
    // 1. Logika Jam Real-time
    function updateClock() {
      const now = new Date();
      
      const timeStr = now.toLocaleTimeString('id-ID', {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
      });

      const dateStr = now.toLocaleDateString('id-ID', {
        weekday: 'long',
        year: 'numeric',
        month: 'long',
        day: 'numeric'
      });

      document.getElementById('clockTime').textContent = timeStr.replace(/\./g, ':');
      document.getElementById('clockDate').textContent = dateStr;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // 2. Logika Tema (Local Storage)
    const themeBtn = document.getElementById('themeBtn');
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark');
    }

    themeBtn.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      const isDark = document.body.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
    });

    // 3. Logika To-Do List (Local Storage)
    const addBtn = document.getElementById('addBtn');
    const taskInput = document.getElementById('taskInput');
    const taskList = document.getElementById('taskList');

    let tasks = JSON.parse(localStorage.getItem('dashboard_tasks')) || [
      { text: 'Merapikan kode HTML dasar', completed: true },
      { text: 'Menyiapkan repositori Git', completed: false }
    ];

    function saveAndRender() {
      localStorage.setItem('dashboard_tasks', JSON.stringify(tasks));
      renderTasks();
    }

    function renderTasks() {
      taskList.innerHTML = '';

      if (tasks.length === 0) {
        taskList.innerHTML = '<li class="empty-state">Belum ada tugas. Yuk tambah satu!</li>';
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        if (task.completed) li.classList.add('completed');

        li.innerHTML = `
          <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${index})">
          <span>${task.text}</span>
          <button class="btn-del" onclick="deleteTask(${index})" title="Hapus">✕</button>
        `;
        taskList.appendChild(li);
      });
    }

    addBtn.addEventListener('click', () => {
      const text = taskInput.value.trim();
      if (text !== '') {
        tasks.push({ text: text, completed: false });
        taskInput.value = '';
        saveAndRender();
      }
    });

    taskInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') addBtn.click();
    });

    window.toggleTask = function(index) {
      tasks[index].completed = !tasks[index].completed;
      saveAndRender();
    };

    window.deleteTask = function(index) {
      tasks.splice(index, 1);
      saveAndRender();
    };

    renderTasks();
  </script>
</body>
</html>
