<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Personal</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="header">
      <div>
        <h1>Halo! 👋</h1>
        <div class="clock-widget">
          <div class="time-display" id="clockTime">00:00:00</div>
          <div class="date-display" id="clockDate">Senin, 1 Januari 2026</div>
        </div>
      </div>
      <button class="theme-toggle" id="themeBtn">🌓 Ganti Tema</button>
    </div>

    <!-- Komponen Kutipan Inspirasi Harian -->
    <div class="quote-card">
      <div class="quote-content">
        <p class="quote-text">“<span id="quoteText">Memuat kutipan...</span>”</p>
        <p class="quote-author">— <span id="quoteAuthor">...</span></p>
      </div>
      <button class="btn-refresh-quote" id="refreshQuoteBtn" title="Ganti kutipan" aria-label="Ganti kutipan">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
        </svg>
      </button>
    </div>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Ketik tugas baru...">
      <button class="btn-add" id="addBtn">Tambah</button>
    </div>

    <ul id="taskList"></ul>
  </div>

  <script src="script.js"></script>
</body>
</html>
